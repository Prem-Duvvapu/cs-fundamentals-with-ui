name: Backend data services

on:
  push:
    branches: [main]
    paths: ['examples/backend-data-services/**', '.github/workflows/data-services.yml']
  pull_request:
    paths: ['examples/backend-data-services/**', '.github/workflows/data-services.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-mongodb:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check the actual Docker kernel against MongoDB compatibility
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          command = ['docker','info','--format','{{.KernelVersion}}|{{.Architecture}}|{{.OSType}}|{{.ServerVersion}}']
          result = subprocess.run(command, capture_output=True, timeout=10)
          if result.returncode or len(result.stdout)>1024:
              raise SystemExit('Cannot observe the actual Docker daemon runtime')
          values = result.stdout.decode('ascii').strip().split('|')
          if len(values)!=4 or any(not re.fullmatch('[A-Za-z0-9._+/-]{1,128}', value) for value in values):
              raise SystemExit('Unexpected Docker runtime metadata')
          kernel, architecture, system, version = values
          match = re.match(r'([0-9]+)[.]([0-9]+)[.]([0-9]+)', kernel)
          if not match or system!='linux':
              raise SystemExit('Observed Linux Docker kernel required')
          release = tuple(map(int, match.groups()))
          supported = not ( (6,19,0) <= release < (7,0,14) )
          report = {'schemaVersion':1,'dockerKernel':kernel,'architecture':architecture,'system':system,
                    'dockerServerVersion':version,'knownMongoKernelIncompatibilityExcluded':supported,
                    'scope':'observed Docker kernel against the documented MongoDB8 incompatibility; not general platform certification',
                    'source':'https://www.mongodb.com/docs/manual/release-notes/8.0/'}
          target=Path('examples/backend-data-services/target/host-runtime.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(report,indent=2)+'\n')
          if not supported:
              raise SystemExit('MongoDB8 refuses Linux6.19 through7.0.13; use a supported Docker host kernel, not an older image or a disabled startup guard')
          print('Observed Docker host kernel is outside the documented incompatible range')
          PY
      - name: Generate private runtime credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import os,secrets
          redis_password=secrets.token_hex(32)
          mongo_password=secrets.token_hex(32)
          values={'DATA_REDIS_PASSWORD':redis_password,'DATA_MONGO_PASSWORD':mongo_password,
                  'DATA_MONGO_URI':'mongodb://lab_owner:'+mongo_password+'@127.0.0.1:27019/?authSource=admin'}
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for key,value in values.items():
                  print('::add-mask::'+value)
                  output.write(key+'='+value+'\n')
          PY
      - name: Start only owned pinned throwaway services
        shell: bash
        run: |
          set -euo pipefail
          data_redis_container="cs-data-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_mongo_container="cs-data-mongo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DATA_REDIS_CONTAINER=$data_redis_container" >> "$GITHUB_ENV"
          echo "DATA_MONGO_CONTAINER=$data_mongo_container" >> "$GITHUB_ENV"
          docker run --detach --name "$data_redis_container" --publish 127.0.0.1:6381:6379 \
            redis:8.4-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4 \
            redis-server --requirepass "$DATA_REDIS_PASSWORD" --save "" --appendonly no \
            --maxmemory 32mb --maxmemory-policy allkeys-lru
          docker run --detach --name "$data_mongo_container" --publish 127.0.0.1:27019:27017 \
            --env MONGO_INITDB_ROOT_USERNAME=lab_owner --env "MONGO_INITDB_ROOT_PASSWORD=$DATA_MONGO_PASSWORD" \
            mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
          data_redis_ready=false
          for data_attempt in $(seq 1 45); do
            if docker exec --env "REDISCLI_AUTH=$DATA_REDIS_PASSWORD" "$data_redis_container" redis-cli ping; then data_redis_ready=true; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$data_redis_container")" != true ]; then
              echo 'Owned Redis exited before readiness' >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$data_redis_ready" != true ]; then echo 'Owned Redis readiness deadline' >&2; exit 1; fi
          data_mongo_ready=false
          for data_attempt in $(seq 1 45); do
            if docker exec --env DATA_MONGO_PASSWORD "$data_mongo_container" mongosh --quiet --eval \
              'const a=db.getSiblingDB("admin"); a.auth("lab_owner",process.env.DATA_MONGO_PASSWORD); if(a.runCommand({ping:1}).ok!==1)quit(2);'; then data_mongo_ready=true; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$data_mongo_container")" != true ]; then
              echo 'Owned MongoDB exited before readiness' >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$data_mongo_ready" != true ]; then echo 'Owned MongoDB readiness deadline' >&2; exit 1; fi
          docker exec "$data_redis_container" redis-server --version
          docker exec --env "REDISCLI_AUTH=$DATA_REDIS_PASSWORD" "$data_redis_container" redis-cli CONFIG GET maxmemory maxmemory-policy
          docker exec --env DATA_MONGO_PASSWORD "$data_mongo_container" mongosh --quiet --eval \
            'const a=db.getSiblingDB("admin"); a.auth("lab_owner",process.env.DATA_MONGO_PASSWORD); print("Actual MongoDB version: "+a.runCommand({buildInfo:1}).version);'
      - name: Execute actual Redis, MongoDB, cache-aside and contract cases
        env:
          DATA_REDIS_INTEGRATION: '1'
          DATA_MONGO_INTEGRATION: '1'
          DATA_SERVICES_INTEGRATION: '1'
          DATA_REDIS_PORT: '6381'
        run: mvn -B --no-transfer-progress -f examples/backend-data-services/pom.xml verify
      - name: Refuse missing or skipped service evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import json
          runtime=json.loads(Path('examples/backend-data-services/target/host-runtime.json').read_text())
          if runtime.get('knownMongoKernelIncompatibilityExcluded') is not True:
              raise SystemExit('Actual supported Docker kernel observation required')
          root=Path('examples/backend-data-services/target/surefire-reports')
          for name,count in {'RedisIntegrationTests':4,'CacheRecoveryRedisTests':5,'MongoIntegrationTests':4,'CacheMongoIntegrationTests':4}.items():
              path=root/('TEST-com.csfundamentals.dataservices.'+name+'.xml')
              if not path.is_file(): raise SystemExit('Missing actual-service report: '+name)
              suite=ET.parse(path).getroot()
              cases=suite.findall('testcase')
              if suite.get('tests')!=str(count) or len(cases)!=count:
                  raise SystemExit('Expected all '+str(count)+' actual '+name+' cases')
              if any(int(suite.get(key,'0')) for key in ('skipped','errors','failures')):
                  raise SystemExit('Skipped or failed real-service evidence: '+name)
              if any(case.find(tag) is not None for case in cases for tag in ('skipped','failure','error')):
                  raise SystemExit('A real-service case did not execute/pass: '+name)
          print('All 17 real service cases executed and passed, with no skips.')
          PY
      - name: Require actual cold-burst, bounded failure and recovery evidence
        run: python3 examples/backend-data-services/verify_cache_recovery.py
      - name: Native runner ownership and cancellation regressions
        run: python3 -m unittest discover -s examples/backend-data-services -p 'test_owned_redis.py'
      - name: Retain bounded owned-service startup diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch('[0-9]{1,20}', run_id) or not re.fullmatch('[0-9]{1,6}', attempt):
              raise SystemExit('Exact generated job identity required')
          secrets = [os.environ.get(key, '') for key in ('DATA_REDIS_PASSWORD', 'DATA_MONGO_PASSWORD', 'DATA_MONGO_URI')]
          result = {'schemaVersion':1, 'scope':'owned CI service startup only; no test completion claim', 'services':{}}
          for role in ('redis','mongo'):
              name = f'cs-data-{role}-{run_id}-{attempt}'
              info = subprocess.run(['docker','container','inspect',name], capture_output=True, timeout=8)
              value = {'inspectionSucceeded': info.returncode == 0}
              if info.returncode == 0:
                  state = json.loads(info.stdout)[0]['State']
                  value.update(running=state['Running'], exitCode=state['ExitCode'], oomKilled=state['OOMKilled'])
                  log = subprocess.run(['docker','logs','--tail','30',name], capture_output=True, timeout=8)
                  text = (log.stdout+log.stderr).decode('utf-8','replace')[-16384:]
                  for secret in secrets:
                      if secret: text = text.replace(secret, '[REDACTED]')
                  value['startupLogTail'] = text
              result['services'][role] = value
          target = Path('examples/backend-data-services/target/service-startup.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, indent=2)+'\n')
          PY
      - name: Retain actual service and query-plan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-data-services-evidence
          path: |
            examples/backend-data-services/target/surefire-reports/
            examples/backend-data-services/target/cache-recovery-evidence.json
            examples/backend-data-services/target/service-startup.json
            examples/backend-data-services/target/host-runtime.json
          if-no-files-found: warn
      - name: Remove only this job's containers and owned anonymous volumes
        if: always() && env.DATA_REDIS_CONTAINER != ''
        shell: bash
        run: docker rm --force --volumes "$DATA_REDIS_CONTAINER" "$DATA_MONGO_CONTAINER"
