name: Backend SSRF lab
on:
  push:
    branches: [main]
    paths: ['examples/backend-ssrf/**', '.github/workflows/backend-ssrf.yml']
  pull_request:
    paths: ['examples/backend-ssrf/**', '.github/workflows/backend-ssrf.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  actual-http-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require supplied OpenSSL (no dependency downloads)
        run: openssl version
      - name: Real owned HTTP and TLS, resolver cancellation and policy regressions (no skips)
        run: python3 examples/backend-ssrf/verify.py
      - name: Require real transport and cleanup evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('examples/backend-ssrf/build/evidence/result.json').read_text())
          if report.get('schemaVersion')!=1 or report.get('testsRun')!=20 or any(report.get(key)!=0 for key in ['failures','errors','skipped']):
              raise SystemExit('All 20 tests without failures/errors/skips required')
          observations=report['observations']
          if report.get('cleanupVerified') is not True or observations.get('httpRequests')!=26 or observations.get('resolverChildren')!=observations.get('resolverChildrenReaped') or observations.get('temporaryTLSMaterialRemoved') is not True:
              raise SystemExit('Actual HTTP and complete cleanup evidence missing')
          cases={case['case']:case for case in report['cases']}
          if cases['actual_redirects_same_authority_and_decoy']['followedRequests']!=0 or cases['actual_tls_hostname_and_trust_failures']['rejectedBeforeHTTP']!=2:
              raise SystemExit('Actual no-follow and TLS identity regressions required')
          huge=cases['actual_huge_decimal_length_typed_rejection_and_recovery']
          if huge.get('decimalDigits')!=5000 or huge.get('rejection')!='body_limit' or huge.get('recoveryAccepted') is not True:
              raise SystemExit('Actual huge decimal framing containment and capacity recovery required')
          entry=cases['actual_scope_entry_term_int_rollback_and_normal_restoration']
          if entry.get('signals')!=['TERM','INT'] or not all(entry.get(key) is True for key in ['previousHandlersRestored','outerStateRestored','signalMaskPreserved']):
              raise SystemExit('Actual cancellation-scope entry rollback and normal restoration required')
          startup=cases['actual_spawn_ownership_term_int_and_threaded_delivery']['scenarios']
          if len(startup)!=4 or not all(item.get('reaped') is True and item.get('priorHandlersAndMaskPreserved') is True for item in startup):
              raise SystemExit('Actual TERM/INT spawn ownership and threaded-delivery cleanup required')
          cancellation=cases['actual_sigterm_executable_boundary']
          if not all(cancellation.get(key) is True for key in ['cancelled','resolverReaped','fixtureClosed','temporaryTLSMaterialRemoved']) or cancellation.get('resolverExitCode')!=-9:
              raise SystemExit('Actual TERM cancellation and child reaping required')
          cleanup=report.get('resolverCleanupCases',[])
          if len(cleanup)!=4 or {(row.get('signal'),row.get('timedOut')) for row in cleanup}!={('SIGTERM',True),('SIGINT',True),('SIGTERM',False),('SIGINT',False)}:
              raise SystemExit('First actual TERM/INT during timeout and successful resolver cleanup required')
          if any(row.get('returnCode')!=(-9 if row['timedOut'] else 0) or row.get('resolverCalls')!=2 or row.get('recordedChildren')!=2 or not all(row.get(key) is True for key in ['childReaped','pipesClosed','registryEmpty','cleanupEventRecorded','recoverySucceeded','callerPolicyPreserved','unrelatedGroupPreserved']) for row in cleanup):
              raise SystemExit('Resolver cleanup, recovery and caller policy must finish before cancellation escapes')
          restoration=report.get('scopeRestorationCases',[])
          expected={(sig,nested,mode) for sig in ['SIGTERM','SIGINT'] for nested in [False,True] for mode in ['normal','body-error','entry-rollback']}
          if len(restoration)!=12 or {(row.get('signal'),row.get('nested'),row.get('mode')) for row in restoration}!=expected:
              raise SystemExit('All 12 first actual TERM/INT caller/nested restoration cases required')
          if any(row.get('actualSignals')!=1 or not all(row.get(key) is True for key in ['callerExceptionPreserved','handlersRestored','outerStateRestored','maskPreserved']) for row in restoration):
              raise SystemExit('Caller exceptions, both handlers, outer state and masks must survive interrupted restoration')
          import hashlib
          root=Path('examples/backend-ssrf')
          names=['fetch.py','resolver_worker.py','fixtures.py','test_fetch.py','test_resolver_cleanup.py','test_scope_restoration.py','verify.py','cancellation.py']
          if report.get('sourceSha256LF')!={name:hashlib.sha256((root/name).read_text().encode()).hexdigest() for name in names}:
              raise SystemExit('Receipt must bind every exact LF-normalized executable and regression source')
          print('Real owned transport, TLS identity, redirect refusal and cancellation evidence verified.')
          PY
      - name: Retain sanitized synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ssrf-evidence
          path: examples/backend-ssrf/build/evidence/
          if-no-files-found: warn
