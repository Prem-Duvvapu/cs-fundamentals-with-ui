name: Actual OAuth PKCE and Task Tracker integration

on:
  push:
    branches: [main]
    paths:
      - 'examples/backend-identity/**'
      - 'examples/java-spring/task-tracker/**'
      - '.github/workflows/backend-identity.yml'
  pull_request:
    paths:
      - 'examples/backend-identity/**'
      - 'examples/java-spring/task-tracker/**'
      - '.github/workflows/backend-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            examples/backend-identity/pom.xml
            examples/java-spring/task-tracker/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public client state and destination guards
        run: python3 -m unittest discover -s examples/backend-identity -p 'test_client.py' -v
      - name: Actual packaged framework authorization and resource servers
        run: python3 examples/backend-identity/verify.py
      - name: Refuse missing actual HTTP evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('examples/backend-identity/target/evidence/verification.json').read_text())
          assert report['java_guard_tests'] == 2
          assert len(report['http_cases']) >= 13
          assert all(case['passed'] for case in report['http_cases'])
          assert report['owned_processes_and_temporary_database_cleaned']
          PY
      - name: Upload sanitized evidence and focused test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-http-evidence
          path: |
            examples/backend-identity/target/evidence/
            examples/backend-identity/target/surefire-reports/
