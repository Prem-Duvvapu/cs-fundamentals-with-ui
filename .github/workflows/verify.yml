name: Verify

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 / vitest 5 (A-10) require Node >=22.22.2 — on Node 20 every test file fails
          # to start with "webidl.util.markAsUncloneable is not a function" (undici's CacheStorage
          # ctor calling an API newer than Node 20's bundled undici exposes). This is a floor, not
          # a moving pin: any later engines bump on these two packages needs this raised to match.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      # test:responsive and diagrams:decode both launch a real Chromium via Playwright — cache the
      # browser binary (large, versioned by package-lock.json) but still install OS-level deps
      # every run, since those aren't part of the cached directory.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      - run: npm run test:responsive --prefix frontend
      - run: npm run diagrams:decode --prefix frontend
      - run: node scripts/validate-content.mjs
      - run: node scripts/audit-simulation-questions.mjs --check
      - run: node --test scripts/validate-content.test.mjs scripts/audit-simulation-questions.test.mjs scripts/diagram-charset.test.mjs
      - run: bash scripts/test-start.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn test -f backend/pom.xml
      - run: mvn verify -f examples/java-spring/task-tracker/pom.xml
      - run: python3 examples/java-spring/task-tracker/verify_http.py
      - run: node scripts/verify-java-examples.mjs
      - run: node --test scripts/verify-java-examples.test.mjs
      - run: javac --release 17 -d /tmp/core-accuracy-java examples/labs/java/AccuracyContracts.java
      - run: java -cp /tmp/core-accuracy-java AccuracyContracts

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t task-tracker-learning examples/java-spring/task-tracker
      - run: |
          docker run -d --name task-tracker-check -p 127.0.0.1:9191:9191 -e TASK_TRACKER_ALICE_PASSWORD=ci-alice -e TASK_TRACKER_BOB_PASSWORD=ci-bob -e TASK_TRACKER_VIEWER_PASSWORD=ci-viewer task-tracker-learning
          trap 'docker rm -f task-tracker-check' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9191/actuator/health/readiness >/dev/null; then
              test "$(docker inspect --format='{{.Config.User}}' task-tracker-check)" = "10001:10001"
              docker stop --time 25 task-tracker-check
              exit_code=$(docker inspect --format='{{.State.ExitCode}}' task-tracker-check)
              test "$exit_code" = "0" || test "$exit_code" = "143"
              docker logs task-tracker-check 2>&1 | grep -q 'Graceful shutdown complete'
              exit 0
            fi
            sleep 2
          done
          docker logs task-tracker-check
          exit 1
      - run: docker compose build
      - run: |
          docker compose up -d
          trap 'docker compose down -v' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9190/api/v1/topics >/dev/null && curl --fail --silent http://localhost:3000/topic/process-management | grep --quiet '<div id="root">'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

  labs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lab-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python3 -m unittest discover -s examples/labs -p test_labs.py -v
      - run: psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f examples/labs/sql/verify.sql
        env:
          PGPASSWORD: lab-password
      - run: psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f examples/labs/sql/accuracy.sql
        env:
          PGPASSWORD: lab-password
      - run: psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f examples/labs/sql/feature-availability.sql
        env:
          PGPASSWORD: lab-password
