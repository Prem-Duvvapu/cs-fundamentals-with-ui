name: Actual Spring configuration and Java debugger

on:
  push:
    branches: [main]
    paths:
      - 'examples/backend-debugging/**'
      - 'examples/java-spring/task-tracker/**'
      - '.github/workflows/backend-debugging.yml'
  pull_request:
    paths:
      - 'examples/backend-debugging/**'
      - 'examples/java-spring/task-tracker/**'
      - '.github/workflows/backend-debugging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-spring-jdi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            examples/backend-debugging/pom.xml
            examples/java-spring/task-tracker/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the existing declared Java dependency set
        run: mvn -B -ntp -f examples/backend-debugging/pom.xml -DskipTests package
      - name: Actual six Spring launches JDI events and ownership guards
        run: python3 -m unittest discover -s examples/backend-debugging -p 'test_*.py' -v
      - name: Require actual complete sanitized evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('examples/backend-debugging/target/evidence')
          configuration = json.loads((root/'configuration.json').read_text())
          debugger = json.loads((root/'debugger.json').read_text())
          assert len(configuration['configurations']) == 6
          assert all(case['childReaped'] for case in configuration['configurations'])
          assert configuration['importedSourcesUnchanged'] and configuration['ownedWorkspaceRemoved']
          actual = debugger['debugger']
          assert actual['conditionalChecks'] == 3 and actual['conditionalMatches'] == 1
          assert actual['caughtExceptions'] == 1 and actual['ownedDebuggeeReaped']
          assert actual['guiOrHumanSession'] is False
          assert debugger['importedSourcesUnchanged'] and debugger['ownedWorkspaceRemoved']
          PY
      - name: Upload only sanitized execution records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-configuration-jdi-evidence
          path: examples/backend-debugging/target/evidence/
