name: Backend messaging lab

on:
  push:
    branches: [main]
    paths:
      - 'examples/backend-messaging/**'
      - '.github/workflows/backend-messaging.yml'
  pull_request:
    paths:
      - 'examples/backend-messaging/**'
      - '.github/workflows/backend-messaging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-brokers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: examples/backend-messaging/pom.xml
      - name: Unit and durable-file tests without brokers
        run: mvn -B -f examples/backend-messaging/pom.xml verify
      - name: Generate ephemeral resources and start owned brokers
        shell: bash
        run: |
          set -euo pipefail
          messaging_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rabbit_user="lab_$(openssl rand -hex 8)"
          rabbit_password="$(openssl rand -hex 32)"
          echo "::add-mask::$rabbit_password"
          echo "::add-mask::$rabbit_user"
          echo "MESSAGING_ID=$messaging_id" >> "$GITHUB_ENV"
          echo "RABBIT_USER=$rabbit_user" >> "$GITHUB_ENV"
          echo "RABBIT_PASSWORD=$rabbit_password" >> "$GITHUB_ENV"
          docker run -d --name "messaging-kafka-$messaging_id" -p 127.0.0.1:9092:9092 apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          docker run -d --name "messaging-rabbit-$messaging_id" -p 127.0.0.1:5672:5672 \
            -e RABBITMQ_DEFAULT_USER="$rabbit_user" -e RABBITMQ_DEFAULT_PASS="$rabbit_password" rabbitmq:4.3.6@sha256:3e5cc23235b0eb850f604e8ace10d9a9b6d05be3e36730e53522ee9ead707a9e
          for attempt in $(seq 1 45); do
            if docker exec "messaging-kafka-$messaging_id" /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 \
              && docker exec "messaging-rabbit-$messaging_id" rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'Owned brokers failed the bounded readiness check' >&2
          exit 1
      - name: Verify actual Kafka and RabbitMQ contracts
        env:
          MESSAGING_BROKERS: 'true'
          KAFKA_BOOTSTRAP: '127.0.0.1:9092'
          RABBIT_PORT: '5672'
        run: mvn -B -f examples/backend-messaging/pom.xml verify
      - name: Refuse a skipped actual-broker run
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path('examples/backend-messaging/target/surefire-reports')
          for name in ('KafkaBrokerTest', 'KafkaRebalanceBrokerTest', 'RabbitBrokerTest'):
              report = ET.parse(reports / f'TEST-com.csfundamentals.messaging.{name}.xml').getroot()
              assert int(report.attrib['tests']) >= 1, f'{name}: no tests'
              for result in ('skipped', 'failures', 'errors'):
                  assert int(report.attrib.get(result, '0')) == 0, f'{name}: {result}'
              print(f'{name}: actual broker test ran and passed')
          import json
          evidence=json.loads(Path('examples/backend-messaging/target/rebalance-evidence.json').read_text())
          if evidence.get('schemaVersion')!=1 or evidence.get('actualCasesExecuted')!=1 or evidence.get('skipped')!=0 or not evidence.get('brokerClusterId'):
              raise SystemExit('Actual broker rebalance receipt required; native compile/skips are insufficient')
          if evidence.get('ownerThreadsDistinct') is not True or evidence.get('ownerThreadsStopped') is not True or evidence.get('ownedBrokerResourcesDeleted') is not True or evidence.get('autoCommit') is not False:
              raise SystemExit('Concurrent owners, manual commits and exact owned cleanup required')
          if evidence.get('pendingWakeupCloseBoundaryExecuted') is not True:
              raise SystemExit('Actual pending-wakeup close/revocation regression required')
          joined=evidence['twoMemberGroup']['members']
          if len(joined)!=2 or sorted(partition for member in joined for partition in member['partitions'])!=[0,1] or any(len(member['partitions'])!=1 for member in joined):
              raise SystemExit('Actual two-member disjoint broker assignment required')
          withheld,replay=evidence['withheldRecord'],evidence['replay']
          original=evidence['withheldDelivery']
          if original.get('applied') is not True or original.get('offsetCommitted') is not False or any(original[key]!=replay[key] for key in ['partition','offset','eventId']):
              raise SystemExit('Independently observed original and replay delivery identity required')
          if any(item['partition']==withheld['partition'] for item in evidence['beforeDepartureOffsets']):
              raise SystemExit('Withheld partition must actually lack a broker commit before departure')
          if withheld['partition']!=replay['partition'] or withheld['offset']!=replay['offset'] or withheld['eventId']!=replay['eventId'] or replay['applied'] is not False or replay['offsetCommitted'] is not True:
              raise SystemExit('Exact uncommitted record replay, local deduplication and offset recovery required')
          if withheld['brokerOffsetCommitted'] is not False or evidence['freshMarkerAccepted'] is not True or evidence['finalProjection']!={'normal':1,'replayedIncludingFreshMarker':2}:
              raise SystemExit('Effect-before-offset boundary and fresh post-recovery work required')
          for name in ['a','b']:
              if not any(item['phase']=='revoked' and item['partitions'] for item in evidence['callbacks'][name]):
                  raise SystemExit('Actual nonempty revocation callback missing: '+name)
          final={item['partition']:item['nextOffset'] for item in evidence['afterRecoveryOffsets']}
          if final[withheld['partition']]!=withheld['offset']+2 or len(final)!=2:
              raise SystemExit('Actual final broker commits must include fresh marker and other partition')
          if not any(item['phase']=='revoked' and any(offset['partition']==withheld['partition'] and offset['nextOffset']==final[withheld['partition']] for offset in item['completedOffsets']) for item in evidence['callbacks']['a']):
              raise SystemExit('Pending-wakeup close must actually complete final revocation offset commit')
          print('Concurrent group assignment, revocation, exact replay/deduplication, fresh work and cleanup verified.')
          PYTHON
      - name: Upload evidence and test failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messaging-test-evidence
          path: |
            examples/backend-messaging/target/surefire-reports/
            examples/backend-messaging/target/rebalance-evidence.json
      - name: Remove only this job's broker containers and anonymous volumes
        if: always()
        shell: bash
        run: |
          messaging_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in "messaging-kafka-$messaging_id" "messaging-rabbit-$messaging_id"; do
            if docker inspect "$name" >/dev/null 2>&1; then
              docker rm -fv "$name"
            fi
          done
