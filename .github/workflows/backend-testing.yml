name: Backend actual Testcontainers HTTP and load lab

on:
  push:
    branches: [main]
    paths:
      - 'examples/backend-testing/**'
      - 'examples/java-spring/task-tracker/**'
      - '.github/workflows/backend-testing.yml'
  pull_request:
    paths:
      - 'examples/backend-testing/**'
      - 'examples/java-spring/task-tracker/**'
      - '.github/workflows/backend-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-testcontainers-http-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            examples/backend-testing/pom.xml
            examples/java-spring/task-tracker/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify evidence guards
        run: python3 -m unittest discover -s examples/backend-testing -p 'test_verify.py' -v
      - name: Actual PostgreSQL Testcontainers HTTP concurrency and error-inclusive load
        run: python3 examples/backend-testing/verify.py
      - name: Upload sanitized actual evidence only
        uses: actions/upload-artifact@v4
        with:
          name: actual-testcontainers-http-load
          path: examples/backend-testing/target/evidence/*.json
          if-no-files-found: error
