version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cs-fundamentals-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./content:/app/content
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/topics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cs-fundamentals-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
