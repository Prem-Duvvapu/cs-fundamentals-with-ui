# PORT takes priority when set -- Render (and most PaaS free tiers) inject PORT
# themselves and require the app to bind to it. Falls back to 8080 for local/
# docker-compose use, where start.sh/docker-compose already map the host port.
server.port=${PORT:8080}
spring.application.name=cs-fundamentals
app.content-root=${CONTENT_ROOT:}
