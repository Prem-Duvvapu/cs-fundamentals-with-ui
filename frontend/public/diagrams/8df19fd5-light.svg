 cross flowchart-v2" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"></path></marker><marker id="d8df19fd5light_flowchart-v2-crossStart" class="marker cross flowchart-v2" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"></path></marker><marker id="d8df19fd5light_flowchart-v2-crossEnd-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"></path></marker><marker id="d8df19fd5light_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g class="root" transform="translate(0, 0)"><g class="clusters"><g class="cluster" id="d8df19fd5light-Metrics" data-look="classic"><rect style="" x="8" y="8" width="962" height="254"></rect></g></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g class="node default" id="d8df19fd5light-flowchart-Cos-0" data-look="classic" transform="translate(175, 135)"><rect class="basic label-container" style="" x="-132" y="-89.5" width="264" height="179"></rect><g class="label" style="" transform="translate(-100, -73.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="147" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Cosine Similarity<br>• Measures angle θ between vectors<br>• Ignores magnitude: Range [-1.0, 1.0]<br>• Ideal for text &amp; document retrieval</p></span></div></foreignObject></g></g><g class="node default" id="d8df19fd5light-flowchart-Dot-1" data-look="classic" transform="translate(489, 135)"><rect class="basic label-container" style="" x="-132" y="-89.5" width="264" height="179"></rect><g class="label" style="" transform="translate(-100, -73.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="147" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Dot Product (Inner Product)<br>• Combines angle and vector magnitude<br>• Fast hardware execution (FMA instructions)<br>• Equals Cosine Similarity when ||A|| = ||B|| = 1</p></span></div></foreignObject></g></g><g class="node default" id="d8df19fd5light-flowchart-Euc-2" data-look="classic" transform="translate(803, 135)"><rect class="basic label-container" style="" x="-132" y="-89.5" width="264" height="179"></rect><g class="label" style="" transform="translate(-100, -73.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="147" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Euclidean Distance (L2)<br>• Straight-line distance between vector endpoints<br>• Range [0, ∞); Lower distance = Higher similarity<br>• Sensitive to document length &amp; token counts</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="d8df19fd5light-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="d8df19fd5light-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="d8df19fd5light-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6d28d9" stop-opacity="1"></stop><stop offset="100%" stop-color="#b3bccb" stop-opacity="1"></stop></linearGradient><g class="cluster-label" transform="translate(389.484375, 8)"><foreignObject width="201" height="21" x="-0.984375"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Geometric Similarity Metrics</p></span></div></foreignObject></g></svg>