<svg id="d8df19fd5light" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 978px;" viewBox="0 0 978 270" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#d8df19fd5light{font-family:'IBM Plex Sans','Segoe UI',sans-serif;font-size:14px;fill:#1f2937;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d8df19fd5light .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#d8df19fd5light .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#d8df19fd5light .error-icon{fill:#f6f7fb;}#d8df19fd5light .error-text{fill:#090804;stroke:#090804;}#d8df19fd5light .edge-thickness-normal{stroke-width:1px;}#d8df19fd5light .edge-thickness-thick{stroke-width:3.5px;}#d8df19fd5light .edge-pattern-solid{stroke-dasharray:0;}#d8df19fd5light .edge-thickness-invisible{stroke-width:0;fill:none;}#d8df19fd5light .edge-pattern-dashed{stroke-dasharray:3;}#d8df19fd5light .edge-pattern-dotted{stroke-dasharray:2;}#d8df19fd5light .marker{fill:#5f6a7c;stroke:#5f6a7c;}#d8df19fd5light .marker.cross{stroke:#5f6a7c;}#d8df19fd5light svg{font-family:'IBM Plex Sans','Segoe UI',sans-serif;font-size:14px;}#d8df19fd5light p{margin:0;}#d8df19fd5light .label{font-family:'IBM Plex Sans','Segoe UI',sans-serif;color:#111827;}#d8df19fd5light .cluster-label text{fill:#090804;}#d8df19fd5light .cluster-label span{color:#090804;}#d8df19fd5light .cluster-label span p{background-color:transparent;}#d8df19fd5light .label text,#d8df19fd5light span{fill:#111827;color:#111827;}#d8df19fd5light .node rect,#d8df19fd5light .node circle,#d8df19fd5light .node ellipse,#d8df19fd5light .node polygon,#d8df19fd5light .node path{fill:#ffffff;stroke:#6d28d9;stroke-width:1px;}#d8df19fd5light .rough-node .label text,#d8df19fd5light .node .label text,#d8df19fd5light .image-shape .label,#d8df19fd5light .icon-shape .label{text-anchor:middle;}#d8df19fd5light .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#d8df19fd5light .rough-node .label,#d8df19fd5light .node .label,#d8df19fd5light .image-shape .label,#d8df19fd5light .icon-shape .label{text-align:center;}#d8df19fd5light .node.clickable{cursor:pointer;}#d8df19fd5light .root .anchor path{fill:#5f6a7c!important;stroke-width:0;stroke:#5f6a7c;}#d8df19fd5light .arrowheadPath{fill:rgba(255, 255, 255, 0);}#d8df19fd5light .edgePaths .path{stroke:#5f6a7c;stroke-width:1px;}#d8df19fd5light .flowchart-link{stroke:#5f6a7c;fill:none;}#d8df19fd5light .edgeLabel{background-color:#ffffff;text-align:center;}#d8df19fd5light .edgeLabel p{background-color:#ffffff;}#d8df19fd5light .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#d8df19fd5light .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#d8df19fd5light .cluster rect{fill:#e8ecf4;stroke:#d4dae5;stroke-width:1px;}#d8df19fd5light .cluster text{fill:#090804;}#d8df19fd5light .cluster span{color:#090804;}#d8df19fd5light .node .collapsed-indicator{fill:#d4dae5;stroke:none;opacity:0.6;}#d8df19fd5light .node .collapsed-separator{stroke:#d4dae5;stroke-width:0.75px;}#d8df19fd5light div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:'IBM Plex Sans','Segoe UI',sans-serif;font-size:12px;background:#f6f7fb;border:1px solid #d4dae5;border-radius:2px;pointer-events:none;z-index:100;}#d8df19fd5light .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#1f2937;}#d8df19fd5light rect.text{fill:none;stroke-width:0;}#d8df19fd5light .icon-shape,#d8df19fd5light .image-shape{background-color:#ffffff;text-align:center;}#d8df19fd5light .icon-shape p,#d8df19fd5light .image-shape p{background-color:#ffffff;padding:2px;}#d8df19fd5light .icon-shape .label rect,#d8df19fd5light .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#d8df19fd5light .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#d8df19fd5light .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#d8df19fd5light .node .neo-node{stroke:#6d28d9;}#d8df19fd5light [data-look="neo"].node rect,#d8df19fd5light [data-look="neo"].cluster rect,#d8df19fd5light [data-look="neo"].node polygon{stroke:url(#d8df19fd5light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d8df19fd5light [data-look="neo"].swimlane.cluster rect{filter:none;}#d8df19fd5light [data-look="neo"].node path{stroke:url(#d8df19fd5light-gradient);stroke-width:1px;}#d8df19fd5light [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d8df19fd5light [data-look="neo"].node .neo-line path{stroke:#6d28d9;filter:none;}#d8df19fd5light [data-look="neo"].node circle{stroke:url(#d8df19fd5light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d8df19fd5light [data-look="neo"].node circle .state-start{fill:#000000;}#d8df19fd5light [data-look="neo"].icon-shape .icon{fill:url(#d8df19fd5light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d8df19fd5light [data-look="neo"].icon-shape .icon-neo path{stroke:url(#d8df19fd5light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d8df19fd5light :root{--mermaid-font-family:'IBM Plex Sans','Segoe UI',sans-serif;}</style><g><marker id="d8df19fd5light_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="d8df19fd5light_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id=