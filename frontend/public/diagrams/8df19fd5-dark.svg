200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Cosine Similarity<br>• Measures angle θ between vectors<br>• Ignores magnitude: Range [-1.0, 1.0]<br>• Ideal for text &amp; document retrieval</p></span></div></foreignObject></g></g><g class="node default" id="d8df19fd5dark-flowchart-Dot-1" data-look="classic" transform="translate(489, 135)"><rect class="basic label-container" style="" x="-132" y="-89.5" width="264" height="179"></rect><g class="label" style="" transform="translate(-100, -73.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="147" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Dot Product (Inner Product)<br>• Combines angle and vector magnitude<br>• Fast hardware execution (FMA instructions)<br>• Equals Cosine Similarity when ||A|| = ||B|| = 1</p></span></div></foreignObject></g></g><g class="node default" id="d8df19fd5dark-flowchart-Euc-2" data-look="classic" transform="translate(803, 135)"><rect class="basic label-container" style="" x="-132" y="-89.5" width="264" height="179"></rect><g class="label" style="" transform="translate(-100, -73.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="147" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Euclidean Distance (L2)<br>• Straight-line distance between vector endpoints<br>• Range [0, ∞); Lower distance = Higher similarity<br>• Sensitive to document length &amp; token counts</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="d8df19fd5dark-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="d8df19fd5dark-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="d8df19fd5dark-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="1"></stop><stop offset="100%" stop-color="#3b4763" stop-opacity="1"></stop></linearGradient><g class="cluster-label" transform="translate(389.484375, 8)"><foreignObject width="201" height="21" x="-0.984375"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Geometric Similarity Metrics</p></span></div></foreignObject></g></svg>