abel,#df8f4df99light .icon-shape .label{text-anchor:middle;}#df8f4df99light .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#df8f4df99light .rough-node .label,#df8f4df99light .node .label,#df8f4df99light .image-shape .label,#df8f4df99light .icon-shape .label{text-align:center;}#df8f4df99light .node.clickable{cursor:pointer;}#df8f4df99light .root .anchor path{fill:#5f6a7c!important;stroke-width:0;stroke:#5f6a7c;}#df8f4df99light .arrowheadPath{fill:rgba(255, 255, 255, 0);}#df8f4df99light .edgePaths .path{stroke:#5f6a7c;stroke-width:1px;}#df8f4df99light .flowchart-link{stroke:#5f6a7c;fill:none;}#df8f4df99light .edgeLabel{background-color:#ffffff;text-align:center;}#df8f4df99light .edgeLabel p{background-color:#ffffff;}#df8f4df99light .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#df8f4df99light .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#df8f4df99light .cluster rect{fill:#e8ecf4;stroke:#d4dae5;stroke-width:1px;}#df8f4df99light .cluster text{fill:#090804;}#df8f4df99light .cluster span{color:#090804;}#df8f4df99light .node .collapsed-indicator{fill:#d4dae5;stroke:none;opacity:0.6;}#df8f4df99light .node .collapsed-separator{stroke:#d4dae5;stroke-width:0.75px;}#df8f4df99light div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:'IBM Plex Sans','Segoe UI',sans-serif;font-size:12px;background:#f6f7fb;border:1px solid #d4dae5;border-radius:2px;pointer-events:none;z-index:100;}#df8f4df99light .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#1f2937;}#df8f4df99light rect.text{fill:none;stroke-width:0;}#df8f4df99light .icon-shape,#df8f4df99light .image-shape{background-color:#ffffff;text-align:center;}#df8f4df99light .icon-shape p,#df8f4df99light .image-shape p{background-color:#ffffff;padding:2px;}#df8f4df99light .icon-shape .label rect,#df8f4df99light .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#df8f4df99light .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#df8f4df99light .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#df8f4df99light .node .neo-node{stroke:#6d28d9;}#df8f4df99light [data-look="neo"].node rect,#df8f4df99light [data-look="neo"].cluster rect,#df8f4df99light [data-look="neo"].node polygon{stroke:url(#df8f4df99light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#df8f4df99light [data-look="neo"].swimlane.cluster rect{filter:none;}#df8f4df99light [data-look="neo"].node path{stroke:url(#df8f4df99light-gradient);stroke-width:1px;}#df8f4df99light [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#df8f4df99light [data-look="neo"].node .neo-line path{stroke:#6d28d9;filter:none;}#df8f4df99light [data-look="neo"].node circle{stroke:url(#df8f4df99light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#df8f4df99light [data-look="neo"].node circle .state-start{fill:#000000;}#df8f4df99light [data-look="neo"].icon-shape .icon{fill:url(#df8f4df99light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#df8f4df99light [data-look="neo"].icon-shape .icon-neo path{stroke:url(#df8f4df99light-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#df8f4df99light :root{--mermaid-font-family:'IBM Plex Sans','Segoe UI',sans-serif;}</style><g><marker id="df8f4df99light_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="df8f4df99light_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="df8f4df99light_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"></path></marker><marker id="df8f4df99light_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,7 11.5,14 11.5,0" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"></polygon></marker><marker id="df8f4df99light_flowchart-v2-circleEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></circle></marker><marker id="df8f4df99light_flowchart-v2-circleStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></circle></marker><marker id="df8f4df99light_flowchart-v2-circleEnd-margin" class="marker flowchart-v2" viewBox="0 0 10 10" refY="5" refX="12.25" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"></circle></marker><marker id="df8f4df99light_flowchart-v2-circleStart-margin" class="marker flowchart-v2" viewBox="0 0 10 10" refX="-2" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"></circle></marker><marker id="df8f4df99light_flowchart-v2-crossEnd" class="marker cross flowchart-v2" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"></path></marker><marker id="df8f4df99light_flowchart-v2-crossStart" class="marker cross flowchart-v2" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"></path></marker><marker id="df8f4df99light_flowchart-v2-crossEnd-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"></path></marker><marker id="df8f4df99light_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"></path></marker><g class="root"><g class="clusters"></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g class="root" transform="translate(0, 0)"><g class="clusters"><g class="cluster" id="df8f4df99light-ForcePolicy" data-look="classic"><rect style="" x="8" y="8" width="648" height="275"></rect></g></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g class="node default" id="df8f4df99light-flowchart-Force-2" data-look="classic" transform="translate(175, 145.5)"><rect class="basic label-container" style="" x="-132" y="-89.5" width="264" height="179"></rect><g class="label" style="" transform="translate(-100, -73.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="147" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>FORCE Policy<br>• All dirty pages flushed to disk at COMMIT<br>• Eliminates need for REDO logging<br>• Terrible random I/O write performance</p></span></div></foreignObject></g></g><g class="node default" id="df8f4df99light-flowchart-NoForce-3" data-look="classic" transform="translate(489, 145.5)"><rect class="basic label-container" style="" x="-132" y="-100" width="264" height="200"></rect><g class="label" style="" transform="translate(-100, -84)"><rect width="2" x="-1"></rect><foreignObject width="202" height="168" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>NO-FORCE Policy<br>• Dirty pages remain in RAM at COMMIT<br>• Relies on sequential WAL log for durability<br>• High throughput; Requires REDO logging on crash</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(698, 0)"><g class="clusters"><g class="cluster" id="df8f4df99light-StealPolicy" data-look="classic"><rect style="" x="8" y="8" width="648" height="275"></rect></g></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g class="node default" id="df8f4df99light-flowchart-Steal-0" data-look="classic" transform="translate(175, 145.5)"><rect class="basic label-container" style="" x="-132" y="-89.5" width="264" height="179"></rect><g class="label" style="" transform="translate(-100, -73.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="147" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>STEAL Policy<br>• Uncommitted dirty pages CAN be evicted to disk<br>• Avoids buffer pool memory exhaustion<br>• Requires UNDO logging to reverse changes on abort</p></span></div></foreignObject></g></g><g class="node default" id="df8f4df99light-flowchart-NoSteal-1" data-look="classic" transform="translate(489, 145.5)"><rect class="basic label-container" style="" x="-132" y="-100" width="264" height="200"></rect><g class="label" style="" transform="translate(-100, -84)"><rect width="2" x="-1"></rect><foreignObject width="202" height="168" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>NO-STEAL Policy<br>• Uncommitted pages NEVER touch disk<br>• Eliminates need for UNDO logging<br>• Constrains long transactions to RAM capacity</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="df8f4df99light-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="df8f4df99light-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="df8f4df99light-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6d28d9" stop-opacity="1"></stop><stop offset="100%" stop-color="#b3bccb" stop-opacity="1"></stop></linearGradient><g class="cluster-label" transform="translate(191.4453125, 8)"><foreignObject width="283" height="21" x="-0.9453125"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Force vs No-Force (Commit Flush Policy)</p></span></div></foreignObject></g><g class="cluster-label" transform="translate(195.140625, 8)"><foreignObject width="276" height="21" x="-1.140625"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Steal vs No-Steal (Page Eviction Policy)</p></span></div></foreignObject></g></svg>