.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>1. Pre-Filtering<br>• Apply scalar WHERE filter first<br>• Run vector search on matching subset<br>• Problem: Breaks HNSW graph connectivity if filtered set is small</p></span></div></foreignObject></g></g><g class="node default" id="d69189595light-flowchart-Post-1" data-look="classic" transform="translate(489, 177)"><rect class="basic label-container" style="" x="-132" y="-100" width="264" height="200"></rect><g class="label" style="" transform="translate(-100, -84)"><rect width="2" x="-1"></rect><foreignObject width="202" height="168" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>2. Post-Filtering<br>• Run ANN vector search first to get top-1000<br>• Discard candidates failing metadata filter<br>• Problem: May return 0 results if filter is highly restrictive</p></span></div></foreignObject></g></g><g class="node default" id="d69189595light-flowchart-Iter-2" data-look="classic" transform="translate(803, 177)"><rect class="basic label-container" style="" x="-132" y="-131.5" width="264" height="263"></rect><g class="label" style="" transform="translate(-100, -115.5)"><rect width="2" x="-1"></rect><foreignObject width="202" height="231" x="-1"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>3. Single-Stage Iterative Graph Filtering (Qdrant/Milvus)<br>• Traverse HNSW graph while dynamically evaluating payload boolean filter<br>• Bypasses invalid nodes without leaving index graph<br>• Guarantees exact K results with high recall</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="d69189595light-d