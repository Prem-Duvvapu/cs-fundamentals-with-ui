server.address=127.0.0.1
server.port=${AI_PORT:9192}
ai.endpoint=${AI_ENDPOINT:http://127.0.0.1:9193/api/chat}
ai.model=${AI_MODEL:teaching-fixture}
ai.timeout-ms=${AI_TIMEOUT_MS:3000}
ai.max-calls=${AI_MAX_CALLS:100}
ai.alice-password=${AI_ALICE_PASSWORD}
ai.bob-password=${AI_BOB_PASSWORD}
management.endpoints.web.exposure.include=health
server.error.include-message=never
spring.application.name=ai-backend-teaching
ai.jdbc-url=${AI_JDBC_URL:jdbc:h2:mem:knowledge;DB_CLOSE_DELAY=-1}
ai.jdbc-user=${AI_JDBC_USER:sa}
ai.jdbc-password=${AI_JDBC_PASSWORD:}
ai.approval-secret=${AI_APPROVAL_SECRET}
