spring.application.name=backend-identity-lab
server.address=127.0.0.1
server.port=0
server.forward-headers-strategy=none
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
server.servlet.session.timeout=2m
server.tomcat.threads.max=4
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=32
server.tomcat.accept-count=16
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=16KB
server.max-http-request-header-size=8KB
server.tomcat.accesslog.enabled=false
logging.level.org.springframework.security=WARN
