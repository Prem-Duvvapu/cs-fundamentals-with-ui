worker_processes 1;
pid /tmp/gateway.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    client_max_body_size 1k;
    client_body_timeout 1s;
    client_header_timeout 2s;
    keepalive_timeout 2s;
    send_timeout 2s;
    log_format evidence escape=json '{"case":"$http_x_lab_case","status":$status,"upstream":"$upstream_status","limit":"$limit_req_status","peer":"$remote_addr","uri":"$uri"}';
    access_log /dev/stdout evidence;
    limit_req_zone $binary_remote_addr zone=per_client:1m rate=1r/s;
    map $http_host $approved_host { default 0; gateway.example.test 1; }
    server {
        listen 8080;
        server_name gateway.example.test;
        if ($approved_host = 0) { return 400; }
        auth_request /_authorize;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_request_buffering on;

        location = /_authorize {
            internal;
            auth_request off;
            include /etc/nginx/proxy-headers.conf;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://task:9191/api/csrf;
        }
        location = /_ready {
            auth_request off;
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://task:9191/actuator/health/readiness;
        }
        location /api/ {
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://task:9191;
        }
        location = /headers {
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://probe:9292/headers;
        }
        location = /limited {
            include /etc/nginx/proxy-headers.conf;
            limit_req zone=per_client burst=2 nodelay;
            limit_req_status 429;
            error_page 429 = @limited;
            proxy_pass http://task:9191/api/projects;
        }
        location @limited {
            auth_request off;
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"gateway_rate_limit"}';
        }
        location = /timeout {
            include /etc/nginx/proxy-headers.conf;
            proxy_read_timeout 20ms;
            proxy_pass http://task:9191/api/observability/probe?scenario=slow;
        }
        location / { return 404; }
    }
}
